version: '3.8'

services:
  api:
    image: ghcr.io/danny-avila/librechat-dev:latest
    container_name: email-demo-api
    ports:
      - 3080:3080
    depends_on:
      - mongodb
      - meilisearch
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=DemoKey123!
      - SEARCH=true
      - USER_REGISTRATION=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMAIL_SERVICE=${EMAIL_SERVICE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./mcp-server:/app/mcp-server:ro
      - ./logs:/app/api/logs
      - /app/client/dist
    networks:
      - librechat-network

  mongodb:
    container_name: email-demo-mongodb
    ports:
      - 27018:27017
    image: mongo
    restart: always
    volumes:
      - ./data-node:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    networks:
      - librechat-network

  meilisearch:
    container_name: email-demo-meilisearch
    image: getmeili/meilisearch:v1.5.1
    restart: always
    ports:
      - 7701:7700
    environment:
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: DemoKey123!
    volumes:
      - ./meili_data:/meili_data
    networks:
      - librechat-network

volumes:
  mongodb-data:
  meilisearch-data:

networks:
  librechat-network:
    driver: bridge