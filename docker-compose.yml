version: '3.8'

services:
  librechat:
    image: ghcr.io/danny-avila/librechat-dev:latest
    ports:
      - "3080:3080"
    environment:
      - MONGO_URI=mongodb://mongo:27017/librechat
      - REDIS_URI=redis://redis:6379
      - GOOGLE_KEY=${GOOGLE_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SEARCH=true
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=demo_master_key
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./demos:/app/demos:ro
      - ./assets:/app/client/public/assets:ro
      - librechat_logs:/app/logs
    depends_on:
      - mongo
      - redis
      - ollama
      - meilisearch
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=librechat
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Local AI Models (Completely Free)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    # Automatically download models on startup
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Search functionality
  meilisearch:
    image: getmeili/meilisearch:v1.5
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=demo_master_key
      - MEILI_ENV=development
    restart: unless-stopped

  # Optional: Model downloader service
  model-setup:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    command: >
      sh -c "
        sleep 30 &&
        ollama pull llama3.2:3b &&
        ollama pull codellama:7b-code &&
        ollama pull mistral:7b &&
        ollama pull gemma2:2b &&
        echo 'Models downloaded successfully!'
      "
    restart: "no"

volumes:
  mongo_data:
  redis_data:
  ollama_data:
  meilisearch_data:
  librechat_logs:

networks:
  default:
    name: librechat-network
