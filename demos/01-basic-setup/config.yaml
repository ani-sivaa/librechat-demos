
version: 1.1.7

cache: true

registration:
  socialLogins: ["github", "google"]
  
  allowedDomains: 
    - "youruniversity.edu"
    - "school.edu"
    - "demo.edu"
  
  allowedEmailDomains:
    - "edu"

interface:
  title: "EduChat - AI Learning Assistant"
  
  customFooter: "Powered by LibreChat | Educational Demo"
  
  helpAndFAQURL: "https://your-institution.edu/ai-help"
  
  privacyPolicy:
    externalUrl: "https://librechat.ai/privacy"
  termsOfService:
    externalUrl: "https://librechat.ai/tos"


endpoints:
  google:
    apiKey: "${GOOGLE_KEY}"
    
    models:
      gemini-1.5-flash:
        displayName: "Gemini Flash (Free) - Quick Responses"
        description: "Fast AI for instant student help and general questions"
        maxContextTokens: 1048576  # 1M tokens context
        maxOutputTokens: 8192
        
      gemini-1.5-pro:
        displayName: "Gemini Pro (Free) - Deep Analysis"
        description: "Advanced AI for complex academic tasks and research"
        maxContextTokens: 1048576  # 1M tokens context
        maxOutputTokens: 8192
        
      gemini-pro:
        displayName: "Gemini Pro Legacy (Free)"
        description: "Stable model for consistent educational results"
        maxContextTokens: 32768
        maxOutputTokens: 8192
    
    userProvide: false
    
  custom:
    - name: "Local AI Models (Free & Private)"
      baseURL: "http://ollama:11434/v1"
      
      apiKey: "dummy_key_not_needed"
      
      models:
        default: 
          - "llama3.2:3b"      # Fast general model
          - "codellama:7b-code" # Programming specialized
          - "mistral:7b"       # Multilingual support
          - "gemma2:2b"        # Efficient small model
        
        fetch: true
      
      titleConvo: true
      titleModel: "llama3.2:3b"
      
      modelDisplayLabel: "Ollama Local"
      
      dropParams: ["stop"]


fileConfig:
  endpoints:
    google:
      fileLimit: 10           # 10 files per conversation
      fileSizeLimit: 25       # 25MB per file
      totalSizeLimit: 100     # 100MB total per conversation
      
      supportedMimeTypes:
        - "application/pdf"                    # Research papers, assignments
        - "text/plain"                         # Text files, essays
        - "text/markdown"                      # Documentation, notes
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"  # Word docs
        
        - "text/x-python"                      # Python assignments
        - "text/javascript"                    # JavaScript code
        - "text/x-java-source"                 # Java assignments
        - "text/html"                          # Web development
        - "text/css"                           # Stylesheets
        - "application/json"                   # Data files
        - "text/csv"                           # Spreadsheet data
        
        - "image/jpeg"                         # Photos, diagrams
        - "image/png"                          # Screenshots, charts
        - "image/gif"                          # Animations
        - "image/webp"                         # Modern image format
        - "image/svg+xml"                      # Vector graphics
    
    custom:
      fileLimit: 5
      fileSizeLimit: 10       # Smaller limit for local processing
      totalSizeLimit: 25
      supportedMimeTypes:
        - "text/plain"
        - "text/x-python"
        - "text/javascript"
        - "application/json"


rateLimits:
  fileUploads:
    windowMs: 900000        # 15 minutes
    max: 20                 # 20 uploads per 15 minutes
    
  conversationsImport:
    windowMs: 3600000       # 1 hour
    max: 5                  # 5 imports per hour

moderation:
  enabled: true
  services:
    google:
      enabled: true
      model: "google-moderation"

speech:
  tts:
    google:
      voice: "en-US-Neural2-A"
      model: "google-tts"
  stt:
    google:
      model: "google-stt"
      language: "en-US"


demo:
  enabled: true
  sampleData: false         # Don't auto-populate with sample data
  showcaseMode: true        # Highlight key features
  educationalPrompts: true  # Show educational prompt suggestions

prelab:
  quickStart: true          # Enable quick start guide
  guidedTour: false         # Disable guided tour for demo
  sampleAssessments: false  # Don't load sample assessments
  testData: false           # Don't create test data


privacy:
  dataRetention: 2555       # days
  
  allowDataExport: true     # Students can export their data
  allowDataDeletion: true   # Students can delete their data
  anonymizeAfterDeletion: true  # Anonymize rather than hard delete

security:
  sessionTimeout: 3600      # 1 hour timeout
  maxSessions: 3            # Max 3 concurrent sessions per user
  
  passwordMinLength: 8
  passwordRequireNumbers: true
  passwordRequireSymbols: false  # Keep simple for students


